# Run ONCE (Actions tab → "Set Firebase secrets" → Run workflow), and again
# whenever you change a key. Copies GitHub secrets into Firebase's Secret
# Manager, where the Cloud Functions read them. Blank secrets are set to
# "placeholder" so deploys don't fail on features you haven't set up yet.
name: Set Firebase secrets

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: __FIREBASE_PROJECT_ID__

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Set secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
        run: |
          for name in OPENAI_API_KEY GEMINI_API_KEY EXCHANGERATE_API_KEY PAYSTACK_SECRET_KEY REVENUECAT_API_KEY REVENUECAT_WEBHOOK_SECRET; do
            value="${!name}"
            [ -z "$value" ] && value="placeholder" && echo "::warning::$name not set — using placeholder"
            printf '%s' "$value" | firebase functions:secrets:set "$name" \
              --project "$FIREBASE_PROJECT_ID" --data-file - --non-interactive --force
          done
