# Run ONCE (Actions tab → "Set Firebase secrets" → Run workflow), and again
# whenever you change a key. Copies GitHub secrets into Firebase's Secret
# Manager, where the Cloud Functions read them. Blank secrets are set to
# "placeholder" so deploys don't fail on features you haven't set up yet.
name: "Temi: Set Firebase secrets"

on:
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: temi-finance

defaults:
  run:
    working-directory: temi

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g firebase-tools
      - name: Authenticate to Google Cloud
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Set secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.TEMI_PAYSTACK_SECRET_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
        run: |
          for name in OPENAI_API_KEY GEMINI_API_KEY EXCHANGERATE_API_KEY PAYSTACK_SECRET_KEY REVENUECAT_API_KEY REVENUECAT_WEBHOOK_SECRET; do
            value="${!name}"
            [ -z "$value" ] && value="placeholder" && echo "::warning::$name not set — using placeholder"
            if ! printf '%s' "$value" | firebase functions:secrets:set "$name" \
                --project "$FIREBASE_PROJECT_ID" --data-file - --non-interactive --force > out.log 2>&1; then
              cat out.log
              tail -5 out.log | while IFS= read -r line; do echo "::error::$name: $line"; done
              exit 1
            fi
            echo "✓ $name"
          done
